baseURL = 'https://humada05.github.io/'
locale = 'en-US'
title = '﷽'
theme = "paper"

[menu]
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 1

[params]
  # color style
  color = 'linen'                           # linen, wheat, gray, light

  # header social icons
#   twitter = 'YOUR_TWITTER_ID'               # twitter.com/YOUR_TWITTER_ID
  github = 'humada05'                 # github.com/YOUR_GITHUB_ID
  instagram = 'ahmed.husayyyn'           # instagram.com/YOUR_INSTAGRAM_ID
  linkedin = 'ahmed-husain-9871b0120'             # linkedin.com/in/YOUR_LINKEDIN_ID
#   mastodon = 'YOUR_MASTODON_LINK'           # e.g. 'https://mastodon.instance/@xxx'
#   threads = '@YOUR_THREADS_ID'              # threads.net/@YOUR_THREADS_ID
#   bluesky = 'YOUR_BLUESKY_ID'               # https://bsky.app/profile/YOUR_BLUESKY_ID
#   rss = true                                # show rss icon

  # home page profile
  avatar = 'ah27182@gmail.com'                 # gravatar email or image url
  name = 'Ahmed Husain'
  bio = 'I’m a builder at heart, always exploring new ways to create. This blog is a place for my thoughts, experiments, and occasional musings on building and learning.'


  # misc
  disableHLJS = true                        # disable highlight.js
  disablePostNavigation = true              # disable post navigation
  monoDarkIcon = true                       # show monochrome dark mode icon
  gravatarCdn = 'https://cdn.v2ex.com/gravatar/'         # e.g. 'https://cdn.v2ex.com/gravatar/'
  math = true                               # enable KaTeX math typesetting globally
  localKatex = false                        # use local KaTeX js/css instead of CDN
#   graphCommentId = "YOUR_GRAPH_COMMENT_ID"  # use graph comment (disqus alternative)
  favicon = "favicon.ico"                   # customize the default favicon
#   appleTouchIcon = "apple-touch-icon.png"   # customize the default Apple touch icon

  # RTL supprot
#   direction = "rtl"                         # RTL support for Right-to-left languages

  # giscus (GitHub Discussions-backed comments) — see https://giscus.app
  # repoId/category/categoryId can't be filled in until Discussions is enabled
  # on the repo and the giscus app is installed; grab them from giscus.app then
  # paste them in below.
[params.giscus]
  repo = 'humada05/humada05.github.io'
  repoId = 'YOUR_GISCUS_REPO_ID'
  category = 'YOUR_GISCUS_CATEGORY'
  categoryId = 'YOUR_GISCUS_CATEGORY_ID'
  mapping = 'pathname'
  theme = 'light'
  lang = 'en'

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true # allow the raw HTML used to load an Arabic web font for Quranic text
